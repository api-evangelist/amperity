note: >-
  Entity graph derived from the 16 component schemas in Amperity's published OpenAPI, plus the Profile
  and Streaming API docs (which have no downloadable spec) and the MCP tool reference. The REST spec
  covers five resource families; the MCP tool surface reveals a much larger internal object model
  (databases, core tables, domain transforms, couriers, feeds, destinations, orchestrations, journeys,
  slices, prediction models, labels) that has no REST representation - those are listed under
  mcp_only_entities so the gap is visible rather than silently missing.
list_envelope:
  shape: '{data: [...], next_token: string, total: integer}'
  schemas: [AuditEventList, CampaignList, SegmentList, IngestJobDetailsList, WorkflowList]
  note: 'Every REST list schema is the same three-field envelope. Reuse is real, not incidental.'
entities:
- name: Tenant
  description: >-
    The top-level container every resource belongs to. Never a REST resource - it is a request
    dimension carried in the Amperity-Tenant header. A sandbox is a distinct tenant with its own id.
  api: all
  schema: null
- name: AuditEvent
  description: A record of user activity in the tenant.
  api: Amperity API
  schema: AuditEvent
  operations: [list-events]
  fields: [event_id, event_type, tenant, tenant_family, happened_at, principal_id, principal_name,
    principal_email, object_id, object_name, origin_ip, user_agent, session_id]
  id_field: event_id
- name: Campaign
  description: A marketing campaign.
  api: Amperity API
  schema: Campaign
  operations: [list-campaign]
  fields: [id, name, deliver_at]
  id_field: id
  note: 'Read-only over REST (list only). Full CRUD exists only on the MCP surface.'
- name: CampaignDraft
  description: A draft campaign.
  api: Amperity API (unstable)
  schema: null
  operations: [list-campaign-draft]
  note: 'Present only in the unstable spec; it returns CampaignList, so a draft is shaped as a Campaign.'
- name: Segment
  description: An audience segment.
  api: Amperity API
  schema: Segment
  operations: [list-segment]
  fields: [id, name, status]
  id_field: id
  note: 'Read-only over REST. Called "iq" on the MCP surface.'
- name: IngestJob
  description: A data ingestion job for a tenant.
  api: Amperity API
  schema: IngestJobDetails
  operations: [list-ingest-jobs, get-ingest-job]
  fields: [id, workflow_id, tables]
  id_field: id
- name: IngestFeedDetails
  description: One table's worth of an ingest job - the per-feed detail record inside a job.
  api: Amperity API
  schema: IngestFeedDetails
  fields: [feed_id, job_id, table_name, state, read, errors, rejected, inserted, updated, started_at,
    ended_at, files]
  id_field: feed_id
- name: IngestFileDetails
  description: One source file inside a feed.
  api: Amperity API
  schema: IngestFileDetails
  fields: [file_id, name, read, errors]
  id_field: file_id
- name: Workflow
  description: >-
    An execution of Amperity work. The generic runner - starting a workflow is how you run a courier
    group, an orchestration group or a campaign.
  api: Amperity API
  schema: Workflow
  operations: [list-workflows, get-workflow, run-workflow, stop-workflow]
  fields: [id, state, type, name, tenant, created_at, ended_at, principal_id, principal_name,
    principal_email, launched_version, current_version, warn_after_ms, task_instances, error]
  id_field: id
- name: WorkflowTaskInstance
  description: One task inside a workflow run.
  api: Amperity API
  schema: WorkflowTaskInstance
  fields: [id, state, tenant, created_at, ended_at, execution_type, label, run_id, state_changed_at,
    task_definition_id, task_definition_type, timeout_ms, workflow_id, error]
  id_field: id
- name: WorkflowError
  description: Structured failure detail attached to a workflow or a task instance.
  api: Amperity API
  schema: WorkflowError
  fields: [type, message, attribution, data]
- name: WorkflowRunRequest
  description: The request body that starts a workflow.
  api: Amperity API
  schema: WorkflowRunRequest
  fields: [config_id, range_from, range_to, run_mode]
  note: 'config_id names the courier group / orchestration group / campaign to run.'
- name: Index
  description: A profile index containing unified customer profiles.
  api: Profile API
  schema: null
  operations: ['GET /indexes', 'GET /indexes/{id}']
  note: 'No published OpenAPI for the Profile API; shape taken from the docs.'
- name: Profile
  description: A unified customer profile (Customer 360) within an index.
  api: Profile API
  schema: null
  operations: ['GET /indexes/{id}/profiles', 'GET /indexes/{id}/profiles/{id}']
- name: Stream
  description: A tenant-specific stream that accepts real-time event ingestion.
  api: Streaming API
  schema: null
  operations: ['POST /stream/v0/data/{stream-id}']
relationships:
- {from: Tenant, to: AuditEvent, type: has_many, via: 'Amperity-Tenant header'}
- {from: Tenant, to: Campaign, type: has_many, via: 'Amperity-Tenant header'}
