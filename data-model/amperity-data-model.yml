- {from: Tenant, to: Index, type: has_many, via: 'amperity-tenant header'}
- {from: Tenant, to: Stream, type: has_many, via: 'X-Amperity-Tenant header'}
- {from: IngestJob, to: Workflow, type: belongs_to, via: workflow_id}
- {from: IngestJob, to: IngestFeedDetails, type: has_many, via: 'tables[]'}
- {from: IngestFeedDetails, to: IngestJob, type: belongs_to, via: job_id}
- {from: IngestFeedDetails, to: IngestFileDetails, type: has_many, via: 'files[]'}
- {from: Workflow, to: WorkflowTaskInstance, type: has_many, via: 'task_instances[]'}
- {from: WorkflowTaskInstance, to: Workflow, type: belongs_to, via: workflow_id}
- {from: Workflow, to: WorkflowError, type: has_one, via: error}
- {from: WorkflowTaskInstance, to: WorkflowError, type: has_one, via: error}
- {from: WorkflowRunRequest, to: Workflow, type: has_one, via: 'config_id names the campaign / courier group / orchestration group to run'}
- {from: CampaignDraft, to: Campaign, type: has_one, via: 'draft promoted to campaign'}
- {from: Index, to: Profile, type: has_many, via: '/indexes/{id}/profiles'}
- {from: Profile, to: Index, type: belongs_to, via: 'index id path segment'}
- {from: AuditEvent, to: Tenant, type: belongs_to, via: 'tenant / tenant_family'}
mcp_only_entities:
  note: >-
    Named in the MCP tool reference with no REST representation in either published spec. Listed as
    entity names only - no field lists, because the MCP tools/list schemas are OAuth-gated.
  entities: [Database, DatabaseTable, Dataset, CoreTable, DomainTransform, Query, QueryFolder,
    StitchReport, StitchBenchmark, Bridge, BridgeShare, Courier, CourierGroup, Feed, Source,
    Destination, DestinationTargetTemplate, Orchestration, OrchestrationGroup, CampaignFolder,
    Journey, JourneyVersion, Slice, PredictionModel, PredictionModelConfig, Label, User, Policy,
    ContextDocument, AlertSubscription, SparkApplication, ConfigVersionNode]
  ref: mcp/amperity-tool-crosswalk.yml
