unversioned_surface:
  note: >-
    The Amperity MCP server is NOT covered by the dated api-version scheme and does not appear in the
    API changelog. Amperity ships it as a hosted service at https://mcp.amperity.com whose tool surface
    changes without a published version, and its own documentation says tools/list is the canonical
    list "available to your account" - i.e. the contract is discovered at runtime, per account, rather
    than pinned to a version. For a surface Amperity documents at more than 200 tools, that is the
    largest unversioned part of its API estate.
  ref: mcp/amperity-mcp.yml
