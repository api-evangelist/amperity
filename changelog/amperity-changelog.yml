scheme: date-string-versions
scheme_note: >-
  API versions are ISO dates sent in the required api-version header. Amperity has shipped exactly two
  versions across two APIs, and neither has ever been superseded - the stable Amperity API is still on
  its launch version 2024-04-01, whose value is the sole member of the api-version enum in the
  published OpenAPI.
