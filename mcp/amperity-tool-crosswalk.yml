  binding: rest
  confidence: high
  note: 'GET /segments. Amperity names the segment domain "iq" in MCP tools and "segments" in REST.'
- tool: workflow_list
  category: workflows-compute
  rest: [list-workflows]
  binding: rest
  confidence: high
  note: 'GET /workflow/runs.'
- tool: workflow_get_status
  category: workflows-compute
  rest: [get-workflow]
  binding: rest
  confidence: medium
  note: >-
    GET /workflow/runs/{workflow-id}. The REST operation returns the full workflow record; the MCP tool
    is named for the status projection. Shape equivalence unconfirmed while tools/list is gated.
- tool: workflow_cancel
  category: workflows-compute
  rest: [stop-workflow]
  binding: rest
  confidence: high
  note: 'POST /workflow/runs/{workflow-id}/stop.'
- tool: courier_group_run
  category: couriers-feeds-destinations
  rest: [run-workflow]
  binding: rest
  confidence: medium
  note: >-
    POST /workflow/runs. The OpenAPI description for run-workflow states it "supports running courier
    groups, orchestration groups, and campaigns", so this tool is one of three fan-in callers of a
    single REST operation. Amperity requires safety mode unrestricted AND confirm:true for this tool.
- tool: orchestration_group_run
  category: orchestrations
  rest: [run-workflow]
  binding: rest
  confidence: medium
  note: >-
    POST /workflow/runs, same fan-in as courier_group_run. Requires unrestricted + confirm:true.
- tool: campaign_schedule
  category: campaigns-journeys
  rest: [run-workflow]
  binding: rest
  confidence: low
  note: >-
    The REST run-workflow operation can run a campaign, but scheduling/unscheduling a send is not the
    same act as starting a run. Mapped as the nearest REST neighbour, not an equivalent.
    Requires unrestricted + confirm:true.
