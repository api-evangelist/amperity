method: derived
source: >-
  mcp/amperity-mcp.yml (227 tools transcribed from https://docs.amperity.com/api/mcp_tool_reference.html)
  bound against openapi/amperity-control-plane-2024-04-01-openapi.json and
  openapi/amperity-control-plane-unstable-openapi.json
note: >-
  Amperity's own MCP documentation states plainly that the MCP server "does not replace the Amperity
  REST API" and directs non-agent integrations to the REST API. This crosswalk measures that divergence:
  the hosted MCP server exposes 227 tools across the whole Amperity product surface (databases, Stitch,
  couriers, journeys, predictions, Spark), while the published OpenAPI covers 10 operations across five
  resources. The two are overlapping-but-non-identical projections of one core, and MCP is by far the
  wider one. Bindings are by name and documented semantics: the live MCP tools/list is OAuth-gated
  (HTTP 401), so no per-tool inputSchema was available to confirm parameter-level equivalence, and
  confidence is set accordingly.
