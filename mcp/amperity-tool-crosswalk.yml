    title: Amperity API
    version: '2024-04-01'
    operations: 9
    gated: false
  - file: openapi/amperity-control-plane-unstable-openapi.json
    title: Amperity API (Unstable)
    version: unstable
    operations: 10
    gated: false
  mcp:
    url: https://mcp.amperity.com
    tools: 227
    gated: true
    gate: 'POST tools/list returns HTTP 401; OAuth authorization_code + PKCE required'
  graphql: null
crosswalk:
