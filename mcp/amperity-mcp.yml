note: >-
  Amperity publishes and HOSTS an official remote MCP server at https://mcp.amperity.com. Amperity's
  own documentation states the server is hosted by Amperity, that customers connect to a single public
  endpoint, and that it is not installed or run locally. The tool list below is transcribed verbatim
  from Amperity's published MCP tool reference (domain_action naming convention, grouped by domain);
  it is NOT derived from the REST OpenAPI. A live tools/list against the endpoint returned HTTP 401
  (www-authenticate: Bearer resource_metadata=.../.well-known/oauth-protected-resource), so per-tool
  inputSchema requires an authenticated introspection and is not captured here.
deployment:
  mode: remote
  endpoint: https://mcp.amperity.com
  auth: oauth
  verified: probed
  probe:
    url: https://mcp.amperity.com
    method: 'POST jsonrpc tools/list'
    http_status: 401
    www_authenticate: 'Bearer resource_metadata="https://mcp.amperity.com/.well-known/oauth-protected-resource"'
    checked: '2026-08-13'
server:
  name: amperity
  transport: http
  url: https://mcp.amperity.com
  hosted_by: Amperity
  routing: >-
    The single public URL automatically routes each request to the Amperity stack that hosts the
    calling user's tenant.
  isolation: >-
    Per-user isolation. Each request is authenticated and scoped to the calling user's identity,
    tenant, and permissions. The MCP server does not bypass Amperity authorization.
  session_state: >-
    Per-token session state (selected tenant and safety mode) persists across requests within the same
    session. Conversation history is not stored.
auth:
  type: oauth2
  flow: authorization_code
  pkce: S256
  issuer: https://mcp.amperity.com
  authorization_endpoint: https://mcp.amperity.com/authorize
  token_endpoint: https://mcp.amperity.com/oauth/token
  registration_endpoint: https://mcp.amperity.com/oauth/register
  dynamic_client_registration: true
  published_client_id: nwbd0MGCyh1VysmYQM05UoDXIuVPdGEs   # published verbatim in the Amperity Claude setup docs
  discovery:
  - well-known/amperity-oauth-authorization-server.json
  - well-known/amperity-oauth-protected-resource.json
  - well-known/amperity-openid-configuration.json
clients:
- name: Claude.ai / Claude Desktop / Claude Code
  docs: https://docs.amperity.com/api/mcp_setup_claude.html
  install: claude mcp add --transport http --scope user amperity https://mcp.amperity.com
- name: ChatGPT custom connectors
  docs: https://docs.amperity.com/api/mcp_setup_chatgpt.html
- name: Microsoft Copilot Studio
  docs: https://docs.amperity.com/api/mcp_setup_m365_copilot.html
  note: >-
    Copilot Studio limits how many tools an agent can register, so the Amperity MCP server serves a
    curated subset of tools to Copilot Studio connections.
- name: Gemini (Antigravity, Gemini CLI)
  docs: https://docs.amperity.com/api/mcp_setup_gemini.html
- name: Snowflake Cortex Agents
  docs: https://docs.amperity.com/api/mcp_setup_snowflake_cortex.html
safety_modes:
  docs: https://docs.amperity.com/api/mcp_safety_modes.html
  scope: per-session, per-user
  default: strict
  control_tools: [safety_get_mode, safety_set_mode]
  modes:
  - mode: strict
    production: Write operations blocked; read operations allowed.
    sandbox: Read and write operations allowed.
  - mode: confirm
    production: "Write operations require an explicit confirm: true argument from the agent."
    sandbox: Read and write operations allowed.
  - mode: unrestricted
    production: All operations allowed without explicit confirmation.
    sandbox: Read and write operations allowed.
  always_confirm:
    tools: [campaign_schedule, courier_group_run, orchestration_group_run]
    rule: >-
      These tools always require safety mode unrestricted AND confirm: true, because they send data to
      downstream systems outside Amperity.
  caveat: >-
    Amperity documents safety mode as a guardrail, not a permission boundary - the agent itself can
    call safety_set_mode. The true permission boundary is the tool permissions configured in the MCP
    client plus the calling user's Amperity policies.
metering:
  tokens: Metered and billed by the customer's own AI platform, never by Amperity.
  amps: >-
    Amperity usage credits are consumed when an agent runs an operation that does work (a database run,
    identity resolution). Running it through MCP adds no extra amp cost over the UI.
tool_count: 227
tool_count_source: >-
  227 tool names transcribed from the published MCP tool reference; Amperity states "more than 200
  tools" and that tools/list is the canonical, per-account authoritative surface.
