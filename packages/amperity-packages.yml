note: >-
  IMPORTANT FINDING - Amperity publishes NO first-party client SDK for the Amperity API, the Profile
  API or the Streaming API in any language. Searched npm, PyPI, Maven Central, NuGet, pkg.go.dev,
  RubyGems, Packagist, crates.io and Clojars; the Amperity API docs themselves point developers at the
  downloadable OpenAPI specification and a generic API tool such as Postman rather than at a client
  library. What Amperity does publish is (a) chuck-data, a first-party AI/CLI tool for data engineering
  that authenticates to Amperity, and (b) a substantial estate of general-purpose Clojure/JVM
  infrastructure libraries under the com.amperity Clojars group. Those Clojure libraries are real,
  maintained, first-party open source, but none of them is a client for an Amperity public API, so
  none is counted as an API SDK.
sdk_count: 0
sdk_count_note: >-
  Zero first-party client libraries for any Amperity public API. Not an omission in this artifact -
  a genuine gap in the provider's developer surface.
