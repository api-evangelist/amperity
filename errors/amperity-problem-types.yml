  - {name: status, type: integer, required: true, description: The HTTP status code, spec_example: 400}
  - {name: message, type: string, required: true, description: A description of the error, spec_example: An unexpected error occurred.}
  - {name: request_id, type: string, required: false, description: Optional Amperity request identifier, source: docs}
  - {name: trace_id, type: string, required: false, description: Optional Amperity tracing identifier, source: docs}
  divergence_note: >-
    The OpenAPI ErrorResponse schema sets additionalProperties:false and declares ONLY status and
    message, while the documented error example on the responses page also returns request_id and
    trace_id. The spec and the docs disagree; a strict client validating against the spec would reject
    the response Amperity's own documentation shows. Recorded, not reconciled.
  example: |
