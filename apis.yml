aid: amperity
name: Amperity
description: >-
  Amperity is a Seattle-based customer data platform (CDP) that helps consumer brands build accurate,
  unified customer profiles by stitching together fragmented first-party data from across their systems.
  Using AI-powered identity resolution (its patented Stitch technology), Amperity assembles a durable
  Customer 360 that powers segmentation, marketing campaigns, personalization, analytics, and activation
  to downstream destinations. For developers, Amperity exposes three public REST APIs: the Amperity API
  for programmatic access to tenant resources (campaigns, segments, ingest jobs, audit events, and
  workflow runs), the Profile API for real-time access to unified customer profiles by index, and the
  Streaming API for low-latency, high-throughput ingestion of events from external systems. Amperity
  publishes a downloadable OpenAPI 3.0.3 document for the Amperity API plus a separate unstable preview
  spec, and it hosts an official remote Model Context Protocol server at mcp.amperity.com exposing more
  than 200 tools across databases, queries, Stitch identity resolution, couriers, destinations,
  campaigns, journeys and predictive models, gated by OAuth2 authorization-code with PKCE and
  per-session safety modes. The REST APIs use OAuth2 client-credentials tokens (JWT bearer),
  cursor pagination, date-based versioning via an api-version header, and an RFC 8594
  deprecation/sunset policy. Amperity serves retail, travel, hospitality, financial services,
  and other consumer-facing verticals.
