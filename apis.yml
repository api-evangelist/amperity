- name: Amperity MCP Server
  description: >-
    Amperity's official hosted remote Model Context Protocol server. A single public endpoint at
    https://mcp.amperity.com routes each request to the Amperity stack holding the calling user's
    tenant, and exposes more than 200 tools across databases, queries, Stitch identity resolution,
    couriers and feeds, destinations, orchestrations, campaigns and journeys, predictive models and
    Spark. Authenticates with OAuth2 authorization-code + PKCE against the user's own Amperity
    credentials, with per-user isolation and per-session safety modes gating writes to production
    tenants. Wider than the REST API by two orders of magnitude.
  humanURL: https://docs.amperity.com/api/mcp_overview.html
  baseURL: https://mcp.amperity.com
