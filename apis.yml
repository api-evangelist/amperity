- name: Amperity Profile API
  description: >-
    RESTful API for real-time access to unified customer profiles. List indexes, fetch an index, and
    read paginated customer profiles (or a single profile) for personalization and downstream
    activation. JWT bearer auth with amperity-tenant and api-version headers.
  humanURL: https://docs.amperity.com/operator/api_profile.html
