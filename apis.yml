aid: amperity
name: Amperity
description: >-
  Amperity is a Seattle-based customer data platform (CDP) that helps consumer brands build accurate,
  unified customer profiles by stitching together fragmented first-party data from across their systems.
  Using AI-powered identity resolution (its patented Stitch technology), Amperity assembles a durable
  Customer 360 that powers segmentation, marketing campaigns, personalization, analytics, and activation
  to downstream destinations. For developers, Amperity exposes three public REST APIs: the Amperity API
  for programmatic access to tenant resources (campaigns, segments, ingest jobs, audit events, and
  workflow runs), the Profile API for real-time access to unified customer profiles by index, and the
  Streaming API for low-latency, high-throughput ingestion of events from external systems. The APIs use
  OAuth2 client-credentials tokens (JWT bearer), date-based versioning via an api-version header, and an
  RFC 8594 deprecation/sunset policy. Amperity serves retail, travel, hospitality, financial services,
  and other consumer-facing verticals.
