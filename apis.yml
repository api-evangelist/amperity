- name: Amperity Streaming API
  description: >-
    Low-latency, high-throughput REST API for real-time ingestion of event data from external systems
    into Amperity. POST JSON or XML payloads (up to 1 MB) to a tenant-specific stream. JWT bearer auth
    with X-Amperity-Tenant header.
  humanURL: https://docs.amperity.com/operator/api_streaming.html
