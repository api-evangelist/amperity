- name: Amperity API (Unstable)
  description: >-
    Amperity's preview track for the Amperity API, published as a separate OpenAPI document alongside
    the stable 2024-04-01 spec. Currently adds GET /campaign-drafts on top of the stable operation set.
    Same base URL, same bearer auth, same required headers; the api-version header takes the value
    "unstable".
  humanURL: https://docs.amperity.com/api/openapi-unstable.html
  baseURL: https://app.amperity.com/api
  tags:
